name: CPU checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test,demo]'
      - name: Check package and demo
        run: |
          python -m compileall -q generate.py app.py wavealign
          python -m pytest -q
          python -c "from pathlib import Path; from app import build_app; app = build_app(Path('unused'), Path('output')); assert app.get_config_file()['components']"
